<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="AI DB Tuner">
  <defs>
    <linearGradient id="db" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#03a9f4"/>
      <stop offset="0.45" stop-color="#0566c8"/>
      <stop offset="1" stop-color="#062f78"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#0a3fa8"/>
      <stop offset="0.6" stop-color="#0a8fd8"/>
      <stop offset="1" stop-color="#14d4c0"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1291d6"/>
      <stop offset="1" stop-color="#1fc9a6"/>
    </linearGradient>
    <linearGradient id="swoosh" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#0a6fe0"/>
      <stop offset="0.45" stop-color="#05b8d8"/>
      <stop offset="1" stop-color="#6ee64a"/>
    </linearGradient>
  </defs>
  <!-- network above the database -->
  <path d="M86 102 A48 48 0 0 1 108 58" fill="none" stroke="url(#ring)" stroke-width="5" stroke-linecap="round"/>
  <path d="M148 58 A48 48 0 0 1 170 102" fill="none" stroke="url(#ring)" stroke-width="5" stroke-linecap="round"/>
  <path d="M84 110 A48 48 0 0 0 90 122" fill="none" stroke="url(#ring)" stroke-width="5" stroke-linecap="round"/>
  <path d="M172 110 A48 48 0 0 1 166 122" fill="none" stroke="url(#ring)" stroke-width="5" stroke-linecap="round"/>
  <line x1="128" y1="50" x2="128" y2="74" stroke="#0a7fc8" stroke-width="6" stroke-linecap="round"/>
  <line x1="92" y1="88" x2="110" y2="94" stroke="#0a6fc0" stroke-width="6" stroke-linecap="round"/>
  <line x1="164" y1="88" x2="146" y2="94" stroke="#12a8b8" stroke-width="6" stroke-linecap="round"/>
  <circle cx="128" cy="40" r="15" fill="url(#node)"/>
  <circle cx="82" cy="84" r="14" fill="url(#node)"/>
  <circle cx="174" cy="84" r="14" fill="#2bc98a"/>
  <!-- database: three stacked segments -->
  <path d="M74 124 a54 14 0 0 1 108 0 v14 a54 14 0 0 1 -108 0 z" fill="url(#db)"/>
  <path d="M74 144 a54 14 0 0 0 108 0 v22 a54 14 0 0 1 -108 0 z" fill="url(#db)"/>
  <path d="M74 172 a54 14 0 0 0 108 0 v24 a54 14 0 0 1 -108 0 z" fill="url(#db)"/>
  <ellipse cx="128" cy="124" rx="54" ry="14" fill="url(#db)" stroke="#fff" stroke-width="3"/>
  <circle cx="128" cy="100" r="22" fill="url(#node)" stroke="#fff" stroke-width="4"/>
  <!-- rising arrow wrapping around the database -->
  <path d="M70 140 C 34 160, 30 196, 92 198 C 150 200, 196 160, 214 116" fill="none" stroke="#fff" stroke-width="20" stroke-linecap="round"/>
  <path d="M70 140 C 34 160, 30 196, 92 198 C 150 200, 196 160, 214 116" fill="none" stroke="url(#swoosh)" stroke-width="13" stroke-linecap="round"/>
  <path d="M190 112 L224 86 L226 126 L215 116 Z" fill="#6ee64a" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>
</svg>
