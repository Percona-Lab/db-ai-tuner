limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
server {
    listen 80;
    server_name _;
    client_max_body_size 20m;
    gzip on;
    gzip_types application/json text/css application/javascript text/plain;
    location /api/auth/ {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/v1/agent/llm/ {
        # AI model calls take 20-90 s (a planner with a reviewer up to ~8 min); the default 60 s read timeout returned 504
        # and the agent retried, each retry another paid model call
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
