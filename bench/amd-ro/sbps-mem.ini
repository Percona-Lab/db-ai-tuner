[bench]
name = sysbench oltp_point_select 4 x 10M rows (~9 GB, fits in the buffer pool), 64 threads co-located, uniform, 3 min warm-up + 5 min, read-only (EPYC 4245P)
run = sysbench oltp_point_select --mysql-user=sbtest --mysql-password=sbtest --mysql-socket=/var/run/mysqld/mysqld.sock --mysql-db=sbtest --tables=4 --table-size=10000000 --threads=64 --rand-type=uniform --time={total} --report-interval=10 --mysql-ignore-errors=all run
warmup = 180
duration = 300
timeout = 900
goal_metric = sysbench_tps
data_state = read-only

[metrics]
sysbench_tps = transactions:\s+\d+\s+\(([\d.]+) per sec
sysbench_p95_ms = 95th percentile:\s+([\d.]+)

[requires]
max_connections = 100
