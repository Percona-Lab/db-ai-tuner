[bench]
name = sysbench oltp_read_only 16 x 10M rows (~37 GB, larger than the buffer pool), 64 threads co-located, uniform, 5 min warm-up + 10 min, read-only (EPYC 4245P)
run = sysbench oltp_read_only --mysql-user=sbtest --mysql-password=sbtest --mysql-socket=/var/run/mysqld/mysqld.sock --mysql-db=sbtest --tables=16 --table-size=10000000 --threads=64 --rand-type=uniform --time={total} --report-interval=10 --mysql-ignore-errors=all run
warmup = 300
duration = 600
timeout = 1500
goal_metric = sysbench_tps
data_state = read-only

[metrics]
sysbench_tps = transactions:\s+\d+\s+\(([\d.]+) per sec
sysbench_p95_ms = 95th percentile:\s+([\d.]+)

[requires]
max_connections = 100
