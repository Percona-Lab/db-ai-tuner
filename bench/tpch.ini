[bench]
name = go-tpc TPC-H SF1, 22 queries, 1 stream, 120 s cap per query
reset = /root/bench/tpch_warm.sh
run = /opt/go-tpc/go-tpc tpch run -H 127.0.0.1 -P 3306 -U tpcc -p tpcc -D tpch --sf 1 --count 22 --enable-query-tuning=false --conn-params max_execution_time=120000 --ignore-error
warmup = 0
duration = 0
timeout = 3600
goal_metric = pass_seconds

[metrics]
pass_seconds = sum:\[Summary\] Q\d+: ([\d.]+)s
geomean_seconds = geomean:\[Summary\] Q\d+: ([\d.]+)s
capped_queries = count:\[Summary\] Q\d+: 1[12]\d\.\d+s
q1_s = \[Summary\] Q1: ([\d.]+)s
q9_s = \[Summary\] Q9: ([\d.]+)s
q17_s = \[Summary\] Q17: ([\d.]+)s
q18_s = \[Summary\] Q18: ([\d.]+)s
q20_s = \[Summary\] Q20: ([\d.]+)s
q21_s = \[Summary\] Q21: ([\d.]+)s
