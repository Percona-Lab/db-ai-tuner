[bench]
name = Insert Benchmark l.i1 steady state (mdcallag iibench): 8 clients x 8 tables (50M rows, 3 secondary indexes, ~59 GB), inserts + deletes at the same rate, 50 rows/commit, 12 min warm-up (cold buffer pool fill) + 5 min, binlog off
reset = /root/bench/reset_datadir.sh
run = /root/bench/ibench/ibench_run.sh write 8 {warmup} {duration} 50
warmup = 720
duration = 300
timeout = 2400
goal_metric = ibench_inserts_per_s
data_state = reset
adaptive_duration = off

[metrics]
ibench_inserts_per_s = ibench_inserts_per_s = ([\d.]+)
ibench_deletes_per_s = ibench_deletes_per_s = ([\d.]+)
insert_rate_cv_pct = ibench_insert_rate_cv_pct = ([\d.]+)
insert_max_ms_p50 = ibench_insert_max_ms_p50 = ([\d.]+)
insert_max_ms_p99 = ibench_insert_max_ms_p99 = ([\d.]+)
hll_end = ibench_hll_end = ([\d.]+)
dirty_pct_avg = ibench_dirty_pct_avg = ([\d.]+)
wait_free_per_s = ibench_wait_free_per_s = ([\d.]+)
iowait_pct = ibench_iowait_pct = ([\d.]+)
