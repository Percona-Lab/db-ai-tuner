[bench]
name = Insert Benchmark qr100 (mdcallag iibench): 8 clients x 8 tables (50M rows, ~59 GB), range queries on secondary indexes as fast as possible with 100 inserts/s + 100 deletes/s per client (800 + 800 /s total) in the background, 2 min warm-up + 5 min, binlog off
reset = /root/bench/reset_datadir.sh
run = /root/bench/ibench/ibench_run.sh query 8 {warmup} {duration} 100 range
warmup = 120
duration = 300
timeout = 1500
goal_metric = ibench_queries_per_s
data_state = reset

[metrics]
ibench_queries_per_s = ibench_queries_per_s = ([\d.]+)
ibench_inserts_per_s = ibench_inserts_per_s = ([\d.]+)
insert_target_pct = achieved ([\d.]+)%
query_max_ms_p50 = ibench_query_max_ms_p50 = ([\d.]+)
query_max_ms_p99 = ibench_query_max_ms_p99 = ([\d.]+)
insert_max_ms_p99 = ibench_insert_max_ms_p99 = ([\d.]+)
hll_end = ibench_hll_end = ([\d.]+)
dirty_pct_avg = ibench_dirty_pct_avg = ([\d.]+)
iowait_pct = ibench_iowait_pct = ([\d.]+)
