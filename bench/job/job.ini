[bench]
name = Join Order Benchmark: IMDb 2013 (21 tables, 74M rows), 113 queries, 1 stream, 60 s cap per query
reset = /root/bench/job/job_warm.sh
run = /root/bench/job/run_job.sh 60
warmup = 0
duration = 0
timeout = 7800
goal_metric = job_total_s
data_state = read-only

[metrics]
job_total_s = JOB total_s=([\d.]+)
job_geomean_s = JOB total_s=[\d.]+ geomean_s=([\d.]+)
job_capped = JOB total_s=.* capped=(\d+)
job_errors = JOB total_s=.* errors=(\d+)
job_queries_over_10s = count:JOB \d+[a-z] time=(?:[1-9]\d|\d{3,})\.\d+
