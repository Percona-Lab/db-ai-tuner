[bench]
name = point_select 64 thr with reconnect every 5 queries from tuner-cli1 (connection storm)
run = ssh -tt -i /root/.ssh/bench_key -o BatchMode=yes root@45.79.194.142 "sysbench oltp_point_select --threads=64 --reconnect=5 --mysql-host=23.92.31.186 --mysql-user=sbtest --mysql-password=sbtest --mysql-db=sbtest --tables=4 --table-size=1000000 --time=310 --report-interval=10 --mysql-ignore-errors=all run"
warmup = 60
duration = 240
timeout = 600

[metrics]
sysbench_qps_whole_run = queries:\s+\d+\s+\(([\d.]+) per sec
sysbench_p95_ms_whole_run = 95th percentile:\s+([\d.]+)
