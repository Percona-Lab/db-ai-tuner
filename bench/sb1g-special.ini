[bench]
name = sysbench oltp_read_write 1 GB, in-memory, 4 tables, 16 threads, rand-type=special, 2 min warm-up + 5 min
reset = /root/bench/reset_datadir.sh
run = sysbench oltp_read_write --mysql-user=sbtest --mysql-password=sbtest --mysql-socket=/var/run/mysqld/mysqld.sock --mysql-db=sbtest --tables=4 --table-size=1000000 --threads=16 --rand-type=special --time=430 --report-interval=10 --mysql-ignore-errors=all run
warmup = 120
duration = 300
timeout = 900

[metrics]
sysbench_tps_whole_run = transactions:\s+\d+\s+\(([\d.]+) per sec
sysbench_p95_ms_whole_run = 95th percentile:\s+([\d.]+)
