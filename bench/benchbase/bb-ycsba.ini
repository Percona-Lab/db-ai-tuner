[bench]
name = BenchBase YCSB-A 50/50 read/update zipfian, 60M rows (~70 GB, ~2x RAM), 64 terminals, 2 + 5 min, binlog off
reset = /root/bench/reset_datadir.sh
run = /root/bench/benchbase/bb_run.sh ycsba {warmup} {duration}
warmup = 120
duration = 300
timeout = 1320
goal_metric = bb_tps
data_state = reset

[metrics]
bb_tps = BBSUMMARY .* throughput_rps=([\d.]+)
bb_avg_ms = BBSUMMARY .* avg_ms=([\d.]+)
bb_p95_ms = BBSUMMARY .* p95_ms=([\d.]+)
bb_p99_ms = BBSUMMARY .* p99_ms=([\d.]+)
