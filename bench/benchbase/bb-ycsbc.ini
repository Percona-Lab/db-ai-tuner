[bench]
name = BenchBase YCSB-C read-only zipfian, 100M rows (~120 GB, ~4x RAM), 64 terminals, 2 + 5 min, binlog off
run = /root/bench/benchbase/bb_run.sh ycsbc {warmup} {duration}
warmup = 120
duration = 300
timeout = 1320
goal_metric = bb_tps
data_state = read-only

[metrics]
bb_tps = BBSUMMARY .* throughput_rps=([\d.]+)
bb_avg_ms = BBSUMMARY .* avg_ms=([\d.]+)
bb_p95_ms = BBSUMMARY .* p95_ms=([\d.]+)
bb_p99_ms = BBSUMMARY .* p99_ms=([\d.]+)
