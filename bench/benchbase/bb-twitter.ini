[bench]
name = BenchBase Twitter 100k users / 4M tweets, 64 terminals, 1 + 4 min, binlog off
reset = /root/bench/reset_datadir.sh
run = /root/bench/benchbase/bb_run.sh twitter {warmup} {duration}
warmup = 60
duration = 240
timeout = 1200
goal_metric = bb_tps
data_state = reset

[metrics]
bb_tps = BBSUMMARY .* throughput_rps=([\d.]+)
bb_avg_ms = BBSUMMARY .* avg_ms=([\d.]+)
bb_p95_ms = BBSUMMARY .* p95_ms=([\d.]+)
bb_p99_ms = BBSUMMARY .* p99_ms=([\d.]+)
