[bench]
name = BenchBase SmallBank 1M accounts, 128 terminals, 1 + 4 min, binlog off
reset = /root/bench/reset_datadir.sh
run = /root/bench/benchbase/bb_run.sh smallbank {warmup} {duration}
warmup = 60
duration = 240
timeout = 1200
goal_metric = bb_tps
data_state = reset

[metrics]
bb_tps = BBSUMMARY .* throughput_rps=([\d.]+)
bb_avg_ms = BBSUMMARY .* avg_ms=([\d.]+)
bb_p95_ms = BBSUMMARY .* p95_ms=([\d.]+)
bb_p99_ms = BBSUMMARY .* p99_ms=([\d.]+)

[requires]
max_connections = 200
