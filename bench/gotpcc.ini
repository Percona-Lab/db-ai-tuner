[bench]
name = go-tpc TPC-C 10W, 10 threads, 2 min warm-up + 5 min
reset = /root/bench/reset_datadir.sh
run = /opt/go-tpc/go-tpc tpcc run -H 127.0.0.1 -P 3306 -U tpcc -p tpcc -D gotpcc --warehouses 10 -T 10 --time 7m10s --interval 30s
warmup = 120
duration = 300
timeout = 900

[metrics]
tpmc_whole_run = tpmC: ([\d.]+)
new_order_p99_ms = \[Summary\] NEW_ORDER .*?99th\(ms\): ([\d.]+)
