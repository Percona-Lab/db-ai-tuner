[bench]
name = deploy canary (bare metal): sysbench oltp_read_write 4 x 1M rows (~1 GB), 16 threads, 80 s warm-up (room for the CPU and off-CPU profiles) + 30 s, data reset per run (agent end-to-end check with expected outcomes, not a benchmark)
reset = /root/bench/reset_datadir.sh
run = sysbench oltp_read_write --mysql-user=sbtest --mysql-password=sbtest --mysql-socket=/var/run/mysqld/mysqld.sock --mysql-db=sbtest --tables=4 --table-size=1000000 --threads=16 --time={total} --report-interval=5 --mysql-ignore-errors=all run
warmup = 80
duration = 30
timeout = 300
goal_metric = sysbench_tps

[metrics]
sysbench_tps = transactions:\s+\d+\s+\(([\d.]+) per sec
sysbench_p95_ms = 95th percentile:\s+([\d.]+)

[requires]
max_connections = 160
