[bench]
name = sysbench oltp_read_write 16 x 2M rows (~8 GB, in memory), 32 threads, uniform, 2 + 5 min, data reset per run
run = sysbench oltp_read_write --tables=16 --table-size=2000000 --threads=32 --rand-type=uniform --mysql-user=sbtest --mysql-password=sbtest --mysql-socket=/var/run/mysqld/mysqld.sock --mysql-db=sbtest --time={total} --report-interval=10 --mysql-ignore-errors=all run
warmup = 120
duration = 300
timeout = 2400
goal_metric = sysbench_tps
reset = /root/bench/reset_datadir.sh

[metrics]
sysbench_tps = transactions:\s+\d+\s+\(([\d.]+) per sec
sysbench_p95_ms = 95th percentile:\s+([\d.]+)

[requires]
max_connections = 600
max_prepared_stmt_count = 1048576
