[bench]
name = sysbench oltp_read_only 16 x 10M rows (~37 GB, larger than the buffer pool), 64 threads, uniform, 3 + 5 min, read-only
run = sysbench oltp_read_only --tables=16 --table-size=10000000 --threads=64 --rand-type=uniform --mysql-user=sbtest --mysql-password=sbtest --mysql-socket=/var/run/mysqld/mysqld.sock --mysql-db=sbtest --time={total} --report-interval=10 --mysql-ignore-errors=all run
warmup = 180
duration = 300
timeout = 2400
goal_metric = sysbench_tps
data_state = read-only

[metrics]
sysbench_tps = transactions:\s+\d+\s+\(([\d.]+) per sec
sysbench_p95_ms = 95th percentile:\s+([\d.]+)

[requires]
max_connections = 600
max_prepared_stmt_count = 1048576
