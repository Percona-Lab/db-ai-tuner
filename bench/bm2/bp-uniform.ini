[bench]
name = sysbench oltp_point_select 16 x 10M rows (~37 GB, larger than memory), 64 threads, uniform, warm-up until the pool is loaded + 5 min, read-only (EPYC 4245P)
run = sysbench oltp_point_select --tables=16 --table-size=10000000 --threads=64 --rand-type=uniform --mysql-user=sbtest --mysql-password=sbtest --mysql-socket=/var/run/mysqld/mysqld.sock --mysql-db=sbtest --time={total} --report-interval=10 --mysql-ignore-errors=all run
warmup = auto
duration = 300
timeout = 2400
goal_metric = sysbench_tps
data_state = read-only

[metrics]
sysbench_tps = transactions:\s+\d+\s+\(([\d.]+) per sec
sysbench_p95_ms = 95th percentile:\s+([\d.]+)

[requires]
max_connections = 600
max_prepared_stmt_count = 1048576
