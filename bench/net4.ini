[bench]
name = read-only large ranges 16 thr from tuner-cli2 (WAN transfers)
run = ssh -tt -i /root/.ssh/bench_key -o BatchMode=yes root@192.155.91.233 "sysbench oltp_read_only --threads=16 --range_size=5000 --simple_ranges=2 --sum_ranges=0 --order_ranges=0 --distinct_ranges=0 --point_selects=0 --mysql-host=23.92.31.186 --mysql-user=sbtest --mysql-password=sbtest --mysql-db=sbtest --tables=4 --table-size=1000000 --time=310 --report-interval=10 --mysql-ignore-errors=all run"
warmup = 60
duration = 240
timeout = 600

[metrics]
sysbench_qps_whole_run = queries:\s+\d+\s+\(([\d.]+) per sec
sysbench_p95_ms_whole_run = 95th percentile:\s+([\d.]+)
