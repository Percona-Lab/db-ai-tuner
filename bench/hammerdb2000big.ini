[bench]
name = HammerDB TPROC-C 2000W, 64 VU from tuner-bigcli (same DC), 5 min ramp-up + 20 min, binlog off
reset = /root/bench/reset_datadir.sh
run = ssh -i /root/.ssh/bench_key -o BatchMode=yes root@50.116.46.101 "mysql --get-server-public-key -h 173.230.136.182 -utpcc -ptpcc -e 'SELECT 1' >/dev/null 2>&1; cd /opt/HammerDB-6.0 && LD_LIBRARY_PATH=/opt/mysqlclient TMP=/tmp HDB_HOST=173.230.136.182 HDB_VU=64 HDB_RAMPUP=5 HDB_DURATION=20 ./hammerdbcli auto /root/bench/hdb_run.tcl"
warmup = 305
duration = 1200
timeout = 2400
goal_metric = nopm

[metrics]
nopm = achieved (\d+) NOPM
tpm = from (\d+) MySQL TPM
