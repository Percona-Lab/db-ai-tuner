[bench]
name = canary: sysbench oltp_read_write 1 GB, 8 threads, 30 s warm-up + 60 s (agent end-to-end check, not a benchmark)
reset = /root/bench/reset_datadir.sh
run = sysbench oltp_read_write --mysql-user=sbtest --mysql-password=sbtest --mysql-socket=/var/run/mysqld/mysqld.sock --mysql-db=sbtest --tables=4 --table-size=1000000 --threads=8 --time={total} --report-interval=5 --mysql-ignore-errors=all run
warmup = 30
duration = 60
timeout = 300
goal_metric = sysbench_tps

[metrics]
sysbench_tps = transactions:\s+\d+\s+\(([\d.]+) per sec
sysbench_p95_ms = 95th percentile:\s+([\d.]+)

[requires]
max_connections = 160
