[bench]
name = Finch orders OLTP: 12 browse + 4 order clients (point selects, range scan, insert, hot-row counter), 1 + 4 min
reset = /root/bench/reset_datadir.sh
run = /root/bench/finch/run_finch.sh oltp {warmup} {duration}
warmup = 60
duration = 240
timeout = 900
goal_metric = finch_qps
data_state = reset

[metrics]
finch_tps = FINCH tps=([\d.]+)
finch_qps = FINCH .* qps=([\d.]+)
finch_p99_ms = FINCH .* p99_ms=([\d.]+)
finch_read_p99_ms = FINCH .* r_p99_ms=([\d.]+)
finch_commit_p99_ms = FINCH .* c_p99_ms=([\d.]+)
finch_errors = FINCH .* errors=(\d+)
