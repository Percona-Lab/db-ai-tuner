[bench]
name = HammerDB TPROC-C 200W, 32 VU from tuner-bigcli (same DC), 2 min ramp-up + 5 min, binlog off
reset = /root/bench/reset_datadir.sh
run = ssh -i /root/.ssh/bench_key -o BatchMode=yes root@50.116.46.101 "cd /opt/HammerDB-6.0 && LD_LIBRARY_PATH=/opt/mysqlclient TMP=/tmp HDB_HOST=173.230.136.182 HDB_VU=32 HDB_RAMPUP=2 HDB_DURATION=5 ./hammerdbcli auto /root/bench/hdb_run.tcl"
warmup = 125
duration = 300
timeout = 900
goal_metric = nopm

[metrics]
nopm = achieved (\d+) NOPM
tpm = from (\d+) MySQL TPM
