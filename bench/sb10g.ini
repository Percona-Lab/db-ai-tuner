[bench]
name = sysbench oltp_read_write 10 GB (16 x 2.5M rows), special distribution, 16 threads co-located, 3 min warm-up + 12 min, binlog off
run = sysbench oltp_read_write --mysql-user=sbtest --mysql-password=sbtest --mysql-db=sbtest --tables=16 --table-size=2500000 --threads=16 --time=930 --report-interval=10 --mysql-ignore-errors=all run
warmup = 180
duration = 720
timeout = 1500

[metrics]
sysbench_tps = transactions:\s+\d+\s+\(([\d.]+) per sec
