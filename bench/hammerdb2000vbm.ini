[bench]
name = HammerDB TPROC-C 2000W, 32 VU co-located, 5 min ramp-up + 10 min, binlog off (Vultr bare metal E-2286G)
reset = /root/bench/reset_datadir.sh
run = cd /opt/HammerDB-6.0 && LD_LIBRARY_PATH=/opt/mysqlclient TMP=/tmp HDB_VU=32 HDB_RAMPUP=5 HDB_DURATION=10 ./hammerdbcli auto /root/bench/hdb_run.tcl
warmup = 305
duration = 600
timeout = 1500
goal_metric = nopm

[metrics]
nopm = achieved (\d+) NOPM
tpm = from (\d+) MySQL TPM
