[bench]
name = go-tpc CH-benCHmark 10W: 8 TPC-C threads + 1 analytical stream, 2 min warm-up + 5 min
reset = /root/bench/reset_datadir.sh
run = /opt/go-tpc/go-tpc ch run -H 127.0.0.1 -P 3306 -U tpcc -p tpcc -D ch --warehouses 10 -T 8 -t 1 --time 7m10s --interval 30s --conn-params max_execution_time=120000 --ap-conn-params max_execution_time=120000 --ignore-error
warmup = 120
duration = 300
timeout = 900

[metrics]
tpmc_whole_run = tpmC: ([\d.]+)
qphh_whole_run = QphH: ([\d.]+)
analytical_queries = count:\[Summary\] Q\d+
