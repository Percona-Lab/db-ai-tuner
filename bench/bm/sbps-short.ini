[bench]
name = bare-metal validation: sysbench oltp_point_select 16 x 1M rows (in memory), 64 threads, 2 + 5 min, read-only
run = sysbench oltp_point_select --mysql-user=sbtest --mysql-password=sbtest --mysql-socket=/var/run/mysqld/mysqld.sock --mysql-db=sbtest --tables=16 --table-size=1000000 --threads=64 --rand-type=uniform --time={total} --report-interval=10 --mysql-ignore-errors=all run
warmup = 120
duration = 300
timeout = 1200
goal_metric = sysbench_tps
data_state = read-only

[metrics]
sysbench_tps = transactions:\s+\d+\s+\(([\d.]+) per sec
sysbench_p95_ms = 95th percentile:\s+([\d.]+)

[requires]
max_prepared_stmt_count = 1048576
