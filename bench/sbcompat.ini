[bench]
name = sysbench oltp_read_write 1 GB in-memory, 4 tables, 16 threads, uniform, 1 min warm-up + 3 min
run = sysbench oltp_read_write --mysql-user=sbtest --mysql-password=sbtest --mysql-socket=/run/mysqld/mysqld.sock --mysql-db=sbtest --tables=4 --table-size=1000000 --threads=16 --rand-type=uniform --time=250 --report-interval=10 --mysql-ignore-errors=all run
warmup = 60
duration = 180
timeout = 600

[metrics]
sysbench_tps_whole_run = transactions:\s+\d+\s+\(([\d.]+) per sec
sysbench_p95_ms_whole_run = 95th percentile:\s+([\d.]+)
