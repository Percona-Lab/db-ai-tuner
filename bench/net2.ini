[bench]
data_state = read-only
name = point_select 64 thr from tuner-cli2 (Newark, 20 ms)
run = ssh -tt -i /root/.ssh/bench_key -o BatchMode=yes root@192.155.91.233 "sysbench oltp_point_select --threads=64 --mysql-host=23.92.31.186 --mysql-user=sbtest --mysql-password=sbtest --mysql-db=sbtest --tables=4 --table-size=1000000 --time=310 --report-interval=10 --mysql-ignore-errors=all run"
warmup = 60
duration = 240
timeout = 600

[metrics]
sysbench_qps_whole_run = queries:\s+\d+\s+\(([\d.]+) per sec
sysbench_p95_ms_whole_run = 95th percentile:\s+([\d.]+)
